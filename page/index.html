<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="The Kingdom of Cleartext — an interactive Zero Trust fable that decodes an old story into Cisco Zero Trust architecture.">
<title>The Kingdom of Cleartext — A Zero Trust Fable</title>

<!-- Type: Cinzel (display), EB Garamond (story serif), Inter (body/tech), Space Mono (codes/labels) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
/* ============================ palette + type ============================ */
:root{
  --midnight:#07182D;
  --gold:#FFB74A;
  --cyan:#02C8FF;
  --wax:#C8324B;
  --bg:#05080F;
  --ink:#020509;
  --parch:#ECD9A8;

  --paper:#efdcac;
  --paper-2:#e3ce97;
  --paper-ink:#3a2f1c;
  --text:#e8eef6;
  --text-dim:#9fb0c4;

  --f-display:'Cinzel','Trajan Pro',Georgia,'Times New Roman',serif;
  --f-serif:'EB Garamond',Georgia,'Times New Roman',serif;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'Space Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;

  --edge:rgba(255,183,74,.24);
  --edge-cyan:rgba(2,200,255,.28);
  --rail-h:78px;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--f-body);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

/* ============================ ambient background ======================= */
#ambient{
  position:fixed; inset:-8%; z-index:-2;
  background-size:cover; background-position:center;
  filter:blur(46px) brightness(.42) saturate(1.15);
  transform:scale(1.12);
  opacity:.9;
  transition:opacity .9s ease, background-image .3s ease;
}
#tint{
  position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(120% 90% at 50% 8%, rgba(13,41,73,.55), transparent 60%),
    radial-gradient(100% 80% at 50% 120%, rgba(2,200,255,.10), transparent 60%),
    linear-gradient(180deg, rgba(5,8,15,.72), rgba(5,8,15,.86));
}

/* ============================ shell layout ============================= */
#app{position:relative; height:100%; display:flex; flex-direction:column}
.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:14px clamp(16px,3vw,34px);
  z-index:5;
}
.brand{display:flex; align-items:baseline; gap:12px; min-width:0}
.brand .mark{
  font-family:var(--f-mono); font-size:11px; letter-spacing:.34em; text-transform:uppercase;
  color:var(--cyan); white-space:nowrap;
}
.brand .name{
  font-family:var(--f-display); font-weight:600; letter-spacing:.06em;
  color:var(--gold); font-size:clamp(13px,1.6vw,17px);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.legend{display:flex; gap:14px; font-family:var(--f-mono); font-size:11px; color:var(--text-dim)}
.legend b{color:var(--gold); font-weight:700}
.legend .k{
  border:1px solid var(--edge); border-radius:5px; padding:1px 6px; color:var(--gold);
  background:rgba(2,6,13,.5);
}

.stage{position:relative; flex:1; overflow:hidden}

/* ============================ slides ================================== */
.slide{
  position:absolute; inset:0;
  display:grid; place-items:center;
  padding:14px clamp(18px,4vw,60px) calc(var(--rail-h) + 22px);
  opacity:0; visibility:hidden; pointer-events:none;
  transition:opacity .5s ease, transform .5s ease;
  transform:translateY(10px) scale(.995);
}
.slide.active{opacity:1; visibility:visible; pointer-events:auto; transform:none}
.slide-inner{width:100%; max-width:1180px}

/* ---- title ---- */
.title{text-align:center}
.title .seal{margin:0 auto 22px}
.title-kicker{
  font-family:var(--f-mono); text-transform:uppercase; letter-spacing:.46em;
  color:var(--cyan); font-size:clamp(11px,1.5vw,14px); margin-bottom:18px;
}
.title h1{
  font-family:var(--f-display); font-weight:700; margin:0;
  font-size:clamp(38px,8.4vw,104px); line-height:1.02; color:var(--gold);
  text-shadow:0 0 44px rgba(255,183,74,.32), 0 2px 2px rgba(0,0,0,.6);
  letter-spacing:.01em;
}
.title .sub{
  font-family:var(--f-serif); font-size:clamp(17px,2.3vw,25px); line-height:1.55;
  color:#d7e1ee; max-width:730px; margin:22px auto 0;
}
.title .hint{
  margin-top:34px; font-family:var(--f-mono); font-size:12px; color:var(--text-dim);
  letter-spacing:.06em;
}
.title .hint .k{border:1px solid var(--edge); border-radius:5px; padding:2px 7px; color:var(--gold); margin:0 2px}

/* ---- chapter divider ---- */
.divider{position:relative; text-align:center; padding:20px}
.divider .ghost{
  position:absolute; inset:0; display:grid; place-items:center; pointer-events:none;
  font-family:var(--f-display); font-weight:700;
  font-size:clamp(160px,34vw,420px); line-height:1;
  color:rgba(255,183,74,.06);
  text-shadow:0 0 60px rgba(2,200,255,.06);
}
.divider .eyebrow{
  position:relative; font-family:var(--f-mono); text-transform:uppercase; letter-spacing:.4em;
  color:var(--cyan); font-size:13px; margin-bottom:14px;
}
.divider h2{
  position:relative; font-family:var(--f-display); font-weight:700; color:var(--gold);
  font-size:clamp(30px,6vw,62px); margin:0; line-height:1.06;
  text-shadow:0 0 34px rgba(255,183,74,.28);
}
.divider .tag{
  position:relative; font-family:var(--f-serif); font-style:italic; color:#d7e1ee;
  font-size:clamp(17px,2.2vw,23px); max-width:640px; margin:18px auto 0;
}
.divider .theme{
  position:relative; display:inline-block; margin-top:22px;
  font-family:var(--f-mono); font-size:11px; letter-spacing:.24em; text-transform:uppercase;
  color:var(--cyan); border:1px solid var(--edge-cyan); border-radius:999px; padding:6px 16px;
  background:rgba(2,20,34,.5);
}

/* ---- panel ---- */
.panel{
  display:grid; grid-template-columns:1.04fr .96fr; gap:clamp(22px,3.2vw,46px);
  align-items:center; width:100%;
}
.frame-wrap{position:relative}
.frame{
  position:relative; aspect-ratio:16/9; border-radius:12px; overflow:hidden;
  background:#02060d; border:1px solid var(--edge);
  box-shadow:0 30px 70px -30px rgba(0,0,0,.9), inset 0 0 0 1px rgba(255,255,255,.02);
}
.frame img{width:100%; height:100%; object-fit:cover; display:block}
.frame .scan{
  position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(180deg, rgba(2,200,255,.05), transparent 22%, transparent 78%, rgba(7,24,45,.35));
}
.code-chip{
  position:absolute; top:12px; left:12px;
  font-family:var(--f-mono); font-size:12px; letter-spacing:.18em; color:var(--gold);
  background:rgba(2,6,13,.72); border:1px solid var(--edge); border-radius:6px;
  padding:5px 10px; backdrop-filter:blur(2px);
}
.cmark{position:absolute; width:18px; height:18px; border:2px solid var(--gold); opacity:.7}
.cmark.tl{top:8px; left:8px; border-right:0; border-bottom:0}
.cmark.tr{top:8px; right:8px; border-left:0; border-bottom:0}
.cmark.bl{bottom:8px; left:8px; border-right:0; border-top:0}
.cmark.br{bottom:8px; right:8px; border-left:0; border-top:0}
.caption{
  margin-top:12px; text-align:center; font-family:var(--f-mono); font-size:12px;
  letter-spacing:.14em; text-transform:uppercase; color:var(--text-dim);
}

.col-right{display:flex; flex-direction:column; min-width:0}

/* parchment story card */
.story-card{
  position:relative; border-radius:10px; padding:clamp(18px,2.4vw,28px);
  color:var(--paper-ink);
  background:
    radial-gradient(120% 140% at 0% 0%, #f6e7bf, transparent 55%),
    radial-gradient(120% 140% at 100% 100%, #d9c489, transparent 55%),
    linear-gradient(160deg, var(--paper), var(--paper-2));
  box-shadow:0 20px 44px -22px rgba(0,0,0,.85), inset 0 0 0 1px rgba(120,90,40,.25),
             inset 0 2px 24px rgba(120,90,40,.14);
  border:1px solid rgba(120,90,40,.4);
}
.story-card::after{
  content:""; position:absolute; inset:6px; border:1px solid rgba(120,90,40,.28);
  border-radius:6px; pointer-events:none;
}
.story-eyebrow{
  font-family:var(--f-mono); text-transform:uppercase; letter-spacing:.28em; font-size:11px;
  color:#8a6a2e; margin-bottom:10px; display:flex; align-items:center; gap:9px;
}
.story-eyebrow::before{content:""; width:16px; height:1px; background:#8a6a2e; display:inline-block}
.story-text{
  font-family:var(--f-serif); font-size:clamp(16px,1.55vw,20px); line-height:1.62; margin:0;
  letter-spacing:.005em;
}
.story-text .drop{
  float:left; font-family:var(--f-display); font-weight:700; font-size:3.1em; line-height:.82;
  padding:.06em .12em 0 0; color:#7a1f2c;
}

/* wax seal divider */
.seal-divider{display:flex; align-items:center; gap:14px; margin:16px 2px}
.seal-divider .ln{flex:1; height:1px; background:linear-gradient(90deg, transparent, rgba(200,50,75,.5), transparent)}
.wax{
  position:relative; width:44px; height:44px; border-radius:50%;
  background:radial-gradient(circle at 38% 34%, #e0546c, var(--wax) 55%, #8e2035);
  box-shadow:0 6px 16px -4px rgba(200,50,75,.6), inset 0 -3px 6px rgba(0,0,0,.35);
  display:grid; place-items:center; color:#4e0e1a; flex:none;
}
.wax svg{width:24px; height:24px}
.wax.small{width:34px; height:34px}
.wax.small svg{width:18px; height:18px}

/* decoder card */
.decoder{
  position:relative; border-radius:10px; overflow:hidden;
  background:linear-gradient(165deg, #0a2137, #061423 60%, #050f1b);
  border:1px solid var(--edge-cyan);
  box-shadow:0 22px 50px -26px rgba(0,0,0,.9), inset 0 0 40px rgba(2,200,255,.05);
  padding:clamp(16px,2.2vw,24px);
}
.decoder-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px}
.decoder-label{
  font-family:var(--f-mono); font-weight:700; text-transform:uppercase; letter-spacing:.22em;
  font-size:clamp(12px,1.4vw,15px); color:var(--cyan);
  display:flex; align-items:center; gap:10px; min-width:0;
}
.decoder-label svg{width:17px; height:17px; flex:none; filter:drop-shadow(0 0 6px rgba(2,200,255,.5))}
.decoder-label .txt{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.decoder-hint{
  font-family:var(--f-mono); font-size:11px; color:var(--text-dim); letter-spacing:.06em; flex:none;
}
.decoder-hint .k{border:1px solid var(--edge-cyan); border-radius:4px; padding:1px 6px; color:var(--cyan)}
.decoder-body{
  font-family:var(--f-body); font-size:clamp(14px,1.42vw,16px); line-height:1.62; color:#cfe6f5; margin:0;
  transition:opacity .45s ease, filter .45s ease;
}
.decoder-tags{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px}
.decoder-tags span{
  font-family:var(--f-mono); font-size:11px; letter-spacing:.06em; color:#bfe9fb;
  border:1px solid var(--edge-cyan); border-radius:999px; padding:4px 11px; background:rgba(2,200,255,.06);
}
/* sealed state */
.decoder .reveal{transition:opacity .4s ease}
.decoder.sealed .decoder-body,
.decoder.sealed .decoder-tags{opacity:0; filter:blur(7px); pointer-events:none}
.decoder .seal-cover{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:12px; text-align:center; padding:16px;
  background:linear-gradient(165deg, rgba(10,33,55,.78), rgba(5,15,27,.82));
  backdrop-filter:blur(3px);
  transition:opacity .4s ease, visibility .4s ease;
}
.decoder:not(.sealed) .seal-cover{opacity:0; visibility:hidden}
.seal-cover .cta{font-family:var(--f-mono); font-size:12px; letter-spacing:.14em; color:#bfe9fb}
.seal-cover .cta b{color:var(--gold)}
.seal-cover .k{
  display:inline-grid; place-items:center; min-width:26px; height:26px; padding:0 7px;
  border:1px solid var(--gold); border-radius:6px; color:var(--gold); font-weight:700;
  box-shadow:0 0 18px rgba(255,183,74,.28);
}

/* ---- recap ---- */
.recap{text-align:center}
.recap .eyebrow{font-family:var(--f-mono); text-transform:uppercase; letter-spacing:.4em; color:var(--cyan); font-size:12px; margin-bottom:10px}
.recap h2{font-family:var(--f-display); font-weight:700; color:var(--gold); font-size:clamp(28px,5vw,52px); margin:0 0 6px; text-shadow:0 0 30px rgba(255,183,74,.25)}
.recap .sub{font-family:var(--f-serif); font-style:italic; color:#d7e1ee; font-size:clamp(16px,2vw,21px); margin-bottom:26px}
.laws{display:grid; gap:12px; text-align:left; max-width:900px; margin:0 auto}
.law{
  display:grid; grid-template-columns:56px 1fr; gap:16px; align-items:center;
  border:1px solid var(--edge); border-radius:10px; padding:14px 18px;
  background:linear-gradient(120deg, rgba(10,26,43,.6), rgba(5,15,27,.55));
}
.law .num{font-family:var(--f-display); font-weight:700; font-size:30px; color:var(--gold); text-align:center; opacity:.85}
.law .fable{font-family:var(--f-serif); font-size:clamp(15px,1.6vw,19px); color:#eef3fa}
.law .decode{font-family:var(--f-body); font-size:clamp(12.5px,1.3vw,14px); color:#9fd8ef; margin-top:3px}
.law .decode b{color:var(--cyan); font-weight:600; font-family:var(--f-mono); font-size:.92em; letter-spacing:.04em}
.recap .close{margin-top:26px; font-family:var(--f-display); font-weight:600; letter-spacing:.08em; color:var(--gold); font-size:clamp(16px,2.4vw,24px)}

/* ============================ nav arrows ============================== */
.nav-btn{
  position:fixed; top:calc(50% - var(--rail-h)/2); transform:translateY(-50%);
  width:52px; height:52px; border-radius:50%; z-index:6; cursor:pointer;
  background:rgba(2,6,13,.5); border:1px solid var(--edge); color:var(--gold);
  display:grid; place-items:center; backdrop-filter:blur(4px);
  transition:background .2s, border-color .2s, transform .15s;
}
.nav-btn:hover{background:rgba(2,6,13,.8); border-color:var(--gold)}
.nav-btn:active{transform:translateY(-50%) scale(.94)}
.nav-btn svg{width:20px; height:20px}
.nav-btn.prev{left:clamp(8px,1.6vw,20px)}
.nav-btn.next{right:clamp(8px,1.6vw,20px)}

/* ============================ progress rail ========================== */
.rail{
  position:fixed; left:0; right:0; bottom:0; height:var(--rail-h); z-index:6;
  display:flex; align-items:center; justify-content:center;
  padding:0 clamp(12px,3vw,34px);
  background:linear-gradient(180deg, transparent, rgba(5,8,15,.9) 44%);
}
.rail-inner{display:flex; gap:clamp(6px,1vw,14px); width:100%; max-width:1120px}
.rail-ch{
  flex:1; display:flex; flex-direction:column; gap:7px; background:none; border:0; padding:6px 2px 4px;
  cursor:pointer; color:inherit; text-align:left;
}
.rail-ch .lbl{
  display:flex; align-items:baseline; gap:8px; font-family:var(--f-mono);
  font-size:11px; letter-spacing:.1em; color:var(--text-dim); transition:color .25s;
  overflow:hidden;
}
.rail-ch .lbl .rn{color:var(--gold); font-weight:700; opacity:.55; transition:opacity .25s}
.rail-ch .lbl .nm{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-transform:uppercase; font-size:10px}
.rail-ch.active .lbl{color:#eaf3fb}
.rail-ch.active .lbl .rn{opacity:1}
.rail-ch.done .lbl .rn{opacity:.9}
.rail-ticks{display:flex; gap:4px}
.tick{
  flex:1; height:4px; border-radius:3px; background:rgba(255,255,255,.13); border:0; padding:0; cursor:pointer;
  transition:background .25s, box-shadow .25s, transform .15s;
}
.tick.filled{background:var(--gold)}
.tick.current{background:var(--cyan); box-shadow:0 0 12px rgba(2,200,255,.7); transform:scaleY(1.6)}
.tick:hover{transform:scaleY(1.7)}

/* ============================ cast overlay =========================== */
.overlay{
  position:fixed; inset:0; z-index:20; display:none; place-items:center;
  padding:clamp(16px,4vh,48px);
  background:rgba(3,6,12,.82); backdrop-filter:blur(9px);
}
.overlay.open{display:grid}
.cast-panel{width:100%; max-width:1180px; max-height:92vh; display:flex; flex-direction:column}
.cast-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:12px}
.cast-head .ttl{font-family:var(--f-display); font-weight:700; color:var(--gold); font-size:clamp(20px,3vw,30px)}
.cast-head .sub{font-family:var(--f-mono); font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--cyan); margin-top:4px}
.cast-close{
  width:44px; height:44px; border-radius:50%; flex:none; cursor:pointer;
  background:rgba(2,6,13,.6); border:1px solid var(--edge); color:var(--gold);
  display:grid; place-items:center;
}
.cast-close:hover{border-color:var(--gold)}
.cast-grid{
  display:grid; grid-template-columns:repeat(4,1fr); gap:14px; overflow:auto; padding:4px;
}
.cast-card{
  border:1px solid var(--edge); border-radius:12px; overflow:hidden;
  background:linear-gradient(180deg, rgba(10,26,43,.7), rgba(5,12,22,.7));
  display:flex; flex-direction:column;
}
.cast-portrait{aspect-ratio:3/4; overflow:hidden; background:#02060d; border-bottom:1px solid var(--edge)}
.cast-portrait img{width:100%; height:100%; object-fit:cover; display:block}
.cast-info{padding:13px 14px 15px; display:flex; flex-direction:column; gap:5px}
.cast-info .role{font-family:var(--f-mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--cyan)}
.cast-info .name{font-family:var(--f-display); font-weight:600; color:var(--gold); font-size:18px; line-height:1.1}
.cast-info .bio{font-family:var(--f-serif); font-size:14px; line-height:1.45; color:#dbe6f2}
.cast-info .maps{
  margin-top:4px; font-family:var(--f-body); font-size:12.5px; line-height:1.4; color:#bfe1f2;
  border-top:1px dashed rgba(2,200,255,.25); padding-top:8px;
}
.cast-info .maps b{
  display:block; font-family:var(--f-mono); font-size:9.5px; letter-spacing:.16em; text-transform:uppercase;
  color:#7fd4f0; margin-bottom:3px; font-weight:700;
}

/* ============================ a11y + motion ========================== */
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
:focus-visible{outline:2px solid var(--cyan); outline-offset:3px; border-radius:6px}
.rail-ch:focus-visible, .tick:focus-visible{outline-offset:5px}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important; animation:none !important}
  #ambient{filter:blur(46px) brightness(.42)}
}

/* ============================ responsive ============================= */
@media (max-width:880px){
  .panel{grid-template-columns:1fr; gap:18px}
  .legend{display:none}
  .slide{padding:12px 16px calc(var(--rail-h) + 16px)}
  .nav-btn{width:44px; height:44px}
  .cast-grid{grid-template-columns:repeat(2,1fr)}
  .rail-ch .lbl .nm{display:none}
  .divider .ghost{font-size:44vw}
}
@media (max-width:560px){
  .cast-grid{grid-template-columns:1fr 1fr}
  .nav-btn.prev{left:6px} .nav-btn.next{right:6px}
  .title h1{font-size:clamp(34px,11vw,60px)}
}
@media (max-height:640px){
  :root{--rail-h:64px}
  .title .hint{margin-top:18px}
}
</style>
</head>
<body>
<div id="ambient" aria-hidden="true"></div>
<div id="tint" aria-hidden="true"></div>

<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="mark">Zero&nbsp;Trust&nbsp;Fable</span>
      <span class="name">The Kingdom of Cleartext</span>
    </div>
    <nav class="legend" aria-label="keyboard shortcuts">
      <span><span class="k">&larr;</span> <span class="k">&rarr;</span> move</span>
      <span><b>D</b> decode</span>
      <span><b>C</b> cast</span>
      <span><b>F</b> full</span>
      <span><b>Home</b> title</span>
    </nav>
  </header>
  <main class="stage" id="stage" aria-live="off"></main>
</div>

<button class="nav-btn prev" id="prev" aria-label="Previous">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
</button>
<button class="nav-btn next" id="next" aria-label="Next">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
</button>

/* ===================== state + navigation ===================== */
const ambient = document.getElementById("ambient");
const live = document.getElementById("live");
const reduced = matchMedia("(prefers-reduced-motion: reduce)");
let current = 0;
const slideEls = [...stage.querySelectorAll(".slide")];

function setAmbient(imgId){
  ambient.style.backgroundImage = 'url("'+asset(imgId)+'")';
}

function updateRail(){
  const s = slides[current];
  let activeCh = -1, activePanel = -1;
  if(s.type==="divider" || s.type==="panel") activeCh = s.ci;
  if(s.type==="panel") activePanel = s.pi;
  if(s.type==="recap") activeCh = STORY.chapters.length; // all done

  railChs.forEach((chEl, ci)=>{
    chEl.classList.toggle("active", ci===activeCh);
    chEl.classList.toggle("done", ci<activeCh);
    const ticks = [...chEl.querySelectorAll(".tick")];
    ticks.forEach((t, pi)=>{
      const filled = (ci<activeCh) || (ci===activeCh && pi<=activePanel);
      const isCurrent = (ci===activeCh && pi===activePanel);
      t.classList.toggle("filled", filled && !isCurrent);
      t.classList.toggle("current", isCurrent);
    });
  });
}

function go(i){
  i = Math.max(0, Math.min(slides.length-1, i));
  if(i===current && slideEls[i].classList.contains("active")) return;
  slideEls[current].classList.remove("active");
  current = i;
  const el = slideEls[current];
  el.classList.add("active");
  // re-seal any decoder on this slide so the fable is presented first
  el.querySelectorAll(".decoder").forEach(d=> d.classList.add("sealed"));
  setAmbient(slides[current].img);
  updateRail();
  announce();
}
function next(){ go(current+1); }
function prev(){ go(current-1); }

function announce(){
  const s = slides[current];
  let msg = "";
  if(s.type==="title") msg = "Title. "+STORY.meta.title;
  else if(s.type==="divider") msg = "Chapter "+STORY.chapters[s.ci].numeral+". "+STORY.chapters[s.ci].title;
  else if(s.type==="panel"){ const p=STORY.chapters[s.ci].panels[s.pi]; msg="Panel "+p.code+". "+p.caption; }
  else if(s.type==="recap") msg = "Recap. "+STORY.recap.title;
  live.textContent = msg;
}

/* ===================== decoder reveal + cipher scramble ===================== */
const CIPHER = "!<>-_\\/[]{}=+*^?#§€¥$0123456789ISCOCISCO";
function scramble(el){
  const finalText = el.dataset.final || el.textContent;
  if(reduced.matches){ el.textContent = finalText; return; }
  let frame = 0;
  const total = finalText.length + 6;
  clearInterval(el._sc);
  el._sc = setInterval(()=>{
    let out = "";
    const settled = Math.floor((frame/total) * finalText.length);
    for(let i=0;i<finalText.length;i++){
      const ch = finalText[i];
      if(ch===" "){ out+=" "; continue; }
      if(i < settled){ out += ch; }
      else { out += CIPHER[Math.floor(Math.random()*CIPHER.length)]; }
    }
    el.textContent = out;
    frame++;
    if(frame > total){ clearInterval(el._sc); el.textContent = finalText; }
  }, 38);
}

function toggleDecoder(){
  const s = slides[current];
  if(s.type!=="panel") return;
  const decoder = slideEls[current].querySelector(".decoder");
  if(!decoder) return;
  const wasSealed = decoder.classList.contains("sealed");
  decoder.classList.toggle("sealed");
  if(wasSealed){
    // just revealed → run cipher on the label
    scramble(decoder.querySelector(".decoder-label .txt"));
  }
}

const castClose = document.getElementById("castClose");
let lastFocus = null;
function openCast(){
  lastFocus = document.activeElement;
  castOverlay.classList.add("open");
  castClose.focus();
}
function closeCast(){
  castOverlay.classList.remove("open");
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}
function castOpen(){ return castOverlay.classList.contains("open"); }
castClose.addEventListener("click", closeCast);
castOverlay.addEventListener("click", (e)=>{ if(e.target===castOverlay) closeCast(); });

/* ===================== fullscreen ===================== */
function toggleFullscreen(){
  if(!document.fullscreenElement){
    (document.documentElement.requestFullscreen||function(){}).call(document.documentElement);
  } else {
    (document.exitFullscreen||function(){}).call(document);
  }
}

/* ===================== keyboard ===================== */
document.addEventListener("keydown",(e)=>{
  const k = e.key;
  if(castOpen()){
    if(k==="Escape" || k==="c" || k==="C"){ e.preventDefault(); closeCast(); }
    return;
  }
  switch(k){
    case "ArrowRight": case "PageDown": e.preventDefault(); next(); break;
    case "ArrowLeft": case "PageUp": e.preventDefault(); prev(); break;
    case " ": case "Spacebar": e.preventDefault(); next(); break;
    case "d": case "D": e.preventDefault(); toggleDecoder(); break;
    case "c": case "C": e.preventDefault(); openCast(); break;
    case "f": case "F": e.preventDefault(); toggleFullscreen(); break;
    case "Home": e.preventDefault(); go(0); break;
    case "End": e.preventDefault(); go(slides.length-1); break;
    case "Escape":
      if(document.fullscreenElement) document.exitFullscreen();
      break;
  }
});

document.getElementById("prev").addEventListener("click", prev);
document.getElementById("next").addEventListener("click", next);

/* click the illustration to toggle the decoder too (nice affordance) */
stage.addEventListener("click",(e)=>{
  const frame = e.target.closest(".frame");
  const cover = e.target.closest(".seal-cover");
  if(frame || cover) toggleDecoder();
});

/* ===================== init ===================== */
setAmbient(slides[0].img);
slideEls[0].classList.add("active");
updateRail();
announce();
</script>
</body>
</html>
