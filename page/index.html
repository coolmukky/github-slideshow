<style>
  :root{
    --midnight:#07182D; --deep:#040D1B; --panel:#0C2038; --panel-2:#0a1a30;
    --stone:#2A3B57; --stone-2:#1E3B5C; --line:#20385a;
    --parch:#e9d8ac; --parch-2:#dcc793; --ink:#2a2313; --ink-soft:#4a4024;
    --gold:#FFB74A; --gold-lt:#ffd98a; --cyan:#37cffb; --cyan-dp:#02C8FF;
    --wax:#C8324B; --magenta:#FF2F8F; --mist:#9fb4d0;
    --fg:#eaf1fb; --fg-dim:#a9bdd8;
    --serif:'EB Garamond',Georgia,'Times New Roman',serif;
    --display:'Cinzel',var(--serif);
    --sans:'Inter',system-ui,-apple-system,sans-serif;
    --mono:'Space Mono',ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--deep); color:var(--fg); font-family:var(--sans);
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  #app{position:fixed; inset:0; display:flex; flex-direction:column}

  /* ambient blurred backdrop of current scene */
  #bg{position:fixed; inset:-6% ; z-index:0; background-size:cover; background-position:center;
      filter:blur(34px) brightness(.5) saturate(1.05); transform:scale(1.12);
      transition:background-image .5s ease, opacity .5s ease; opacity:.9}
  /* title screen: let the cover art read as a hero instead of a blurred wallpaper */
  #bg.hero{filter:blur(2px) brightness(.78) saturate(1.06); opacity:1}
  #bg.hero::after{background:radial-gradient(120% 90% at 50% 34%, rgba(4,10,20,.18) 20%, rgba(4,10,20,.72) 100%), linear-gradient(180deg, rgba(4,13,27,.42), rgba(4,13,27,.80))}
  #bg::after{content:""; position:absolute; inset:0;
      background:radial-gradient(120% 90% at 50% 30%, transparent 40%, rgba(4,10,20,.75) 100%), linear-gradient(180deg, rgba(4,13,27,.55), rgba(4,13,27,.85))}

  /* ---------- top bar ---------- */
  header{position:relative; z-index:5; display:flex; align-items:center; justify-content:space-between;
    padding:16px 22px; gap:16px}
  .mark{display:flex; align-items:center; gap:12px; min-width:0}
  .crest{width:30px;height:30px;flex:0 0 auto}
  /* the brand must yield to the buttons rather than run underneath them:
     it may shrink and, if there is still not room, truncate */
  .mark{min-width:0; overflow:hidden}
  .mark > div{min-width:0; overflow:hidden}
  .mark b{font-family:var(--display); font-weight:700; font-size:clamp(11px,1.4vw,15px); letter-spacing:.14em;
    text-transform:uppercase; color:var(--gold-lt); white-space:nowrap;
    display:block; overflow:hidden; text-overflow:ellipsis}
  .tools{flex:0 0 auto}
  .mark span{font-family:var(--mono); font-size:11px; color:var(--fg-dim); letter-spacing:.05em}
  .tools{display:flex; gap:8px; align-items:center}
  button.tool{
    font-family:var(--mono); font-size:11.5px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--fg-dim); background:rgba(12,32,56,.55); border:1px solid var(--line);
    padding:9px 13px; border-radius:999px; cursor:pointer; transition:.18s; backdrop-filter:blur(6px)}
  button.tool:hover{color:var(--fg); border-color:var(--cyan); box-shadow:0 0 0 1px rgba(55,207,251,.25)}
  button.tool[aria-pressed="true"]{color:var(--midnight); background:var(--cyan); border-color:var(--cyan)}
  button.tool:focus-visible{outline:2px solid var(--cyan); outline-offset:2px}

  /* ---------- stage ---------- */
  main{position:relative; z-index:4; flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center;
    padding:6px 34px 4px}
  .scene{width:min(1240px,100%); display:none}
  .scene.on{display:block}

  /* panel scene */
  .panel{display:grid; grid-template-columns:1.42fr 1fr; gap:30px; align-items:center}
  .frame{position:relative; border-radius:12px; overflow:hidden; border:1px solid var(--stone);
    box-shadow:0 24px 60px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.03);
    aspect-ratio:16/9; background:#0a1826}
  .frame img{width:100%; height:100%; object-fit:cover; display:block; animation:kbn 16s ease-in-out infinite alternate}
  @keyframes kbn{from{transform:scale(1.02)}to{transform:scale(1.08)}}
  .code{position:absolute; left:14px; top:13px; font-family:var(--mono); font-size:12px; font-weight:700;
    letter-spacing:.12em; color:var(--cyan); background:rgba(4,13,27,.72); border:1px solid rgba(55,207,251,.5);
    padding:5px 10px; border-radius:7px; backdrop-filter:blur(4px)}
  .corner{position:absolute; width:16px;height:16px; border:2px solid rgba(255,183,74,.6)}
  .corner.tl{left:8px;top:8px;border-right:0;border-bottom:0}
  .corner.tr{right:8px;top:8px;border-left:0;border-bottom:0}
  .corner.bl{left:8px;bottom:8px;border-right:0;border-top:0}
  .corner.br{right:8px;bottom:8px;border-left:0;border-top:0}

  .telling{max-width:440px}
  .eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--gold); margin-bottom:14px; display:flex; align-items:center; gap:9px}
  .eyebrow .rn{color:var(--fg-dim)}
  .story{position:relative; background:
      linear-gradient(180deg,#efe0b8,#e3cf9d); color:var(--ink);
    border-radius:10px; padding:22px 24px 24px; box-shadow:0 12px 34px rgba(0,0,0,.4);
    border:1px solid #c7ab6b;}
  .story::before{content:""; position:absolute; inset:0; border-radius:10px; pointer-events:none;
    background:radial-gradient(140% 120% at 90% 0%, rgba(255,255,255,.35), transparent 40%),
              radial-gradient(120% 120% at 0% 100%, rgba(120,90,40,.16), transparent 45%)}
  .story .lab{font-family:var(--mono); font-size:10.5px; letter-spacing:.2em; text-transform:uppercase;
    color:#8a6a2c; margin-bottom:9px}
  .story p{font-family:var(--serif); font-size:22px; line-height:1.42; font-weight:500}
  .seal{display:flex; align-items:center; gap:12px; margin:16px 2px 15px}
  .seal .ln{height:1px; flex:1; background:linear-gradient(90deg,transparent,var(--line))}
  .seal .ln.r{background:linear-gradient(90deg,var(--line),transparent)}
  .seal svg{width:26px;height:26px;flex:0 0 auto;opacity:.9}

  .decoded{overflow:hidden; transition:max-height .5s ease, opacity .4s ease, transform .4s ease;
    max-height:320px; opacity:1}
  .decoded.hidden{max-height:0; opacity:0; transform:translateY(-6px)}
  .tech{position:relative; background:linear-gradient(180deg,#0d2440,#0a1c33);
    border:1px solid var(--stone-2); border-radius:10px; padding:16px 18px 17px;
    box-shadow:0 12px 30px rgba(0,0,0,.4)}
  .tech::before{content:""; position:absolute; left:0; top:12px; bottom:12px; width:3px; border-radius:3px;
    background:linear-gradient(var(--cyan),var(--cyan-dp))}
  .tech .lab{font-family:var(--mono); font-size:10.5px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--cyan); margin-bottom:8px; padding-left:10px}
  .tech p{font-family:var(--sans); font-size:14.5px; line-height:1.5; color:#d6e6f8; padding-left:10px}

  /* divider scene */
  .divider{text-align:left; max-width:900px}
  .divider .kicker{font-family:var(--mono); letter-spacing:.32em; text-transform:uppercase; font-size:13px;
    color:var(--cyan); margin-bottom:16px}
  .divider h2{font-family:var(--display); font-weight:800; font-size:clamp(34px,6vw,66px); line-height:1.02;
    letter-spacing:.01em; text-shadow:0 6px 30px rgba(0,0,0,.6)}
  .divider .tag{font-family:var(--serif); font-style:italic; font-size:clamp(17px,2.4vw,23px); color:var(--fg-dim);
    margin-top:16px; max-width:720px}
  .concept{display:inline-flex; align-items:center; gap:14px; margin-top:26px; padding:11px 18px;
    background:rgba(8,20,36,.6); border:1px solid var(--line); border-radius:999px; backdrop-filter:blur(6px)}
  .concept .c{font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--cyan)}
  .concept .d{font-size:14px; color:var(--fg)}
  .concept .ga{font-family:var(--mono); font-size:11px; color:var(--gold); letter-spacing:.06em;
    border-left:1px solid var(--line); padding-left:14px}

  /* title & recap */
  .title-wrap{text-align:center; max-width:min(1120px, 92vw); margin:0 auto}
  .title-wrap .a{font-family:var(--mono); letter-spacing:.5em; text-transform:uppercase; font-size:12px;
    color:var(--cyan); margin-bottom:22px}
  /* Cinzel at 700 reads as carved rather than bulky; gold makes the title part of the
     palette's language (gold = the kingdom) instead of the one element outside it.
     Sized in vw so the longest line always fits — it previously overflowed its own
     container at desktop widths and was clipped outright on phones. */
  .title-wrap h1{font-family:var(--display); font-weight:700; color:var(--gold);
    font-size:clamp(27px, 6.1vw, 76px); line-height:1.02; letter-spacing:.03em;
    text-wrap:balance;
    text-shadow:0 0 60px rgba(255,183,74,.26), 0 6px 28px rgba(0,0,0,.78)}
  /* the hard <br> is right on wide screens and wrong on narrow ones, where the line
     must be free to break wherever it fits */
  @media (max-width:700px){ .title-wrap h1 br{display:none} }
  .title-wrap .sub{font-family:var(--serif); font-size:clamp(16px,2.3vw,21px); color:var(--fg-dim);
    margin:22px auto 0; max-width:640px; line-height:1.5}
  .enter{margin-top:34px; font-family:var(--mono); font-size:13px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--midnight); background:linear-gradient(180deg,var(--gold-lt),var(--gold)); border:0;
    padding:15px 30px; border-radius:999px; cursor:pointer; box-shadow:0 10px 30px rgba(255,183,74,.28); transition:.2s}
  .enter:hover{transform:translateY(-2px); box-shadow:0 16px 38px rgba(255,183,74,.4)}
  .enter:focus-visible{outline:2px solid #fff; outline-offset:3px}
  .hint{margin-top:18px; font-family:var(--mono); font-size:11px; color:var(--mist); letter-spacing:.05em}
  .hint kbd{background:rgba(255,255,255,.08); border:1px solid var(--line); border-radius:5px; padding:2px 7px; color:var(--fg); font-family:var(--mono)}

  .recap{max-width:820px; margin:0 auto; width:100%}
  .recap h2{font-family:var(--display); font-weight:700; font-size:clamp(28px,5vw,44px); margin-bottom:8px; text-align:center}
  .recap .lead{font-family:var(--serif); font-style:italic; color:var(--fg-dim); text-align:center; margin-bottom:26px}
  .recap ol{list-style:none; display:flex; flex-direction:column; gap:11px}
  .recap li{display:flex; gap:18px; align-items:center; background:rgba(12,32,56,.5); border:1px solid var(--line);
    border-radius:12px; padding:15px 20px}
  .recap .num{font-family:var(--display); font-weight:700; color:var(--cyan); font-size:20px; width:30px; flex:0 0 auto}
  .recap .rt b{font-family:var(--sans); font-weight:600; display:block; font-size:15px; color:var(--fg)}
  .recap .rt span{font-size:13.5px; color:var(--fg-dim)}

  /* ---------- rail ---------- */
  footer{position:relative; z-index:5; display:flex; align-items:center; gap:16px; padding:12px 22px 16px}
  .nav{display:flex; gap:8px}
  .nav button{width:42px;height:42px;border-radius:50%; border:1px solid var(--line); background:rgba(12,32,56,.55);
    color:var(--fg); cursor:pointer; font-size:17px; transition:.18s; display:grid; place-items:center; backdrop-filter:blur(6px)}
  .nav button:hover:not(:disabled){border-color:var(--cyan); color:var(--cyan)}
  .nav button:disabled{opacity:.32; cursor:default}
  .nav button:focus-visible{outline:2px solid var(--cyan); outline-offset:2px}
  .rail{flex:1 1 auto; display:flex; gap:10px; align-items:center}
  .chseg{flex:1; display:flex; flex-direction:column; gap:6px; cursor:pointer; padding:6px 2px; border-radius:8px;
    background:none; border:0; font:inherit; color:inherit; text-align:left; -webkit-appearance:none}
  .chseg:hover .chname{color:var(--fg)}
  .chseg:focus-visible{outline:2px solid var(--cyan); outline-offset:2px}
  .chseg .ticks{display:flex; gap:4px}
  .chseg .tick{height:4px; flex:1; background:var(--stone); border-radius:3px; transition:.25s}
  .chseg.active .tick{background:var(--stone-2)}
  .chseg .tick.done{background:var(--gold)}
  .chseg .tick.cur{background:var(--cyan); box-shadow:0 0 8px rgba(55,207,251,.7)}
  .chname{font-family:var(--mono); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--fg-dim);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:.2s}
  .counter{font-family:var(--mono); font-size:12px; color:var(--fg-dim); white-space:nowrap; min-width:74px; text-align:right}
  .counter b{color:var(--gold)}

  /* ---------- cast overlay ---------- */
  .overlay{position:fixed; inset:0; z-index:20; background:rgba(4,10,20,.82); backdrop-filter:blur(10px);
    display:none; align-items:center; justify-content:center; padding:30px}
  .overlay.on{display:flex; animation:fade .25s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .castbox{width:min(1080px,100%); max-height:88vh; overflow:auto; background:linear-gradient(180deg,#0b1f38,#08182c);
    border:1px solid var(--stone-2); border-radius:18px; padding:26px 28px 30px; box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .castbox h3{font-family:var(--display); font-weight:700; font-size:26px; letter-spacing:.02em}
  .castbox .sub{font-family:var(--serif); font-style:italic; color:var(--fg-dim); margin:4px 0 22px}
  .castgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px}
  .cc{background:rgba(7,24,45,.6); border:1px solid var(--line); border-radius:14px; overflow:hidden; text-align:center}
  .cc img{width:100%; aspect-ratio:1; object-fit:cover; display:block}
  .cc .nm{font-family:var(--display); font-weight:600; font-size:15px; color:var(--gold-lt); margin:12px 8px 3px}
  .cc .rl{font-size:12px; color:var(--fg-dim); margin:0 10px 14px; line-height:1.35}
  .close{position:absolute; top:22px; right:26px; z-index:21}

  /* skip link — first tab stop, lets keyboard users jump past the toolbar */
  .skip{position:absolute; left:-9999px; top:0; z-index:40; background:var(--cyan); color:var(--midnight);
    font-family:var(--mono); font-size:12px; padding:10px 16px; border-radius:0 0 8px 0; text-decoration:none}
  .skip:focus{left:0}

  /* visually hidden, still read aloud */
  .sr-only{position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden;
    clip:rect(0 0 0 0); white-space:nowrap; border:0}

  /* an image that fails to load shouldn't leave a silent empty frame */
  .frame img.err{opacity:0}
  .frame.err::after{content:"illustration unavailable"; position:absolute; inset:0; display:grid; place-items:center;
    font-family:var(--mono); font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--fg-dim)}

  /* safety net: on very short viewports let the stage scroll instead of clipping */
  @media (max-height:560px){
    body{overflow:auto}
    #app{position:relative; min-height:100%}
    main{overflow-y:auto}
  }

  @media (max-width:860px){
    main{padding:4px 16px}
    .panel{grid-template-columns:1fr; gap:16px}
    .telling{max-width:none}
    .story p{font-size:19px}
    .mark span{display:none}
    .chname{display:none}
    .castgrid{grid-template-columns:repeat(2,1fr)}
    .rail{gap:6px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important; transition:none !important}
  }
</style>
</head>
<body>
<div id="bg"></div>
<a class="skip" href="#stage">Skip to the storyboard</a>
<div id="app">
  <header>
    <div class="mark">
      <svg class="crest" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <path d="M16 2l3.4 3.2L24 3.6l.6 4.8 4.4 1.2-2 4.4 3 3.6-3.8 2.6.4 4.7-4.6-.6L16 30l-3.4-2.9-4.6.6.4-4.7L4.6 20l3-3.6-2-4.4 4.4-1.2L10.6 6 15 5.2 16 2z" fill="#0c2038" stroke="#FFB74A" stroke-width="1.1"/>
        <rect x="12" y="11" width="8" height="9" rx="1" fill="#FFB74A"/><rect x="14.6" y="15" width="2.8" height="5" fill="#0c2038"/>
        <rect x="11" y="9" width="2.3" height="3" fill="#FFB74A"/><rect x="18.7" y="9" width="2.3" height="3" fill="#FFB74A"/>
      </svg>
      <div><b>Ultra Secure Collaboration</b><br><span>An interactive storyboard</span></div>
    </div>
    <div class="tools">
      <button class="tool" id="btnCast" aria-haspopup="dialog">Cast</button>
      <button class="tool" id="btnDecode" aria-pressed="true" title="Toggle the Cisco decoder (D)">Decoded</button>
      <button class="tool" id="btnFull" title="Fullscreen (F)">Fullscreen</button>
    </div>
  </header>

  <main id="stage" tabindex="-1" aria-label="Storyboard"><!-- scenes injected --></main>
  <p id="liveNote" aria-live="polite" class="sr-only"></p>

  <footer>
    <div class="nav">
      <button id="prev" aria-label="Previous (left arrow)">‹</button>
      <button id="next" aria-label="Next (right arrow)">›</button>
    </div>
    <div class="rail" id="rail"></div>
    <div class="counter" id="counter"></div>
  </footer>
</div>

<div class="overlay" id="castOverlay" role="dialog" aria-modal="true" aria-label="Cast of characters">
  <button class="tool close" id="castClose">Close ✕</button>
  <div class="castbox">
    <h3>The Cast</h3>
    <div class="sub">Who's who in the fable — and what each one really is.</div>
    <div class="castgrid" id="castGrid"></div>
  </div>
</div>

<script>
const A = './assets/';
const CH = [
  {n:1, num:'I',   src:15, title:'Independently Verified Identity', concept:'Zero-Trust Identity for every meeting', ga:'GA Q3 CY26', hero:'p14',
   tagline:'Only independently verified individuals get in — and deepfakes don’t.'},
  {n:2, num:'II',  src:16, title:'Zero-Trust End-to-End Encryption', concept:'Zero-Trust Encryption for all calls & meetings', ga:'GA Q3 CY26', hero:'p22',
   tagline:'A shared secret only the participants hold — the provider can’t listen in.'},
  {n:3, num:'III', src:17, title:'Adding Services into the Meeting', concept:'Fully-featured Zero-Trust Meetings — recording & AI', ga:'GA Q3 CY26', hero:'p31',
   tagline:'Trusted scribes and advisors join under the same rules — records stay with the customer.'},
  {n:4, num:'IV',  src:18, title:'Including Others — PSTN & Beyond', concept:'Bridging legacy & external audio into Zero-Trust meetings', ga:'GA Q4 CY26', hero:'p42',
   tagline:'A controlled gateway lets the chamber speak to the outside world.'},
  {n:5, num:'V',   src:19, title:'Adding External Participants', concept:'External participants via standard browser — C2B', ga:'GA Q3 CY26', hero:'p54',
   tagline:'Guests join securely from anywhere with a temporary, time-bound identity.'},
];
const PANELS = {
1:[
 ['p11','1.1','Each Lord is issued with two forms of identity.','Every participant is provisioned two independent identity factors — no single token grants trust.'],
 ['p12','1.2','A Medallion that marks them a Lord, used together with their voice.','Webex Identity (the medallion) is bound to a live voiceprint — mitigating impersonation and deepfakes.'],
 ['p13','1.3','A “letters patent” — signed and sealed by the King.','A unique, per-user credential (individual identity) is cryptographically issued by the enterprise.'],
 ['p14','1.4','To enter the chamber, participant Lords show their medallions to the guards, verify with their voice, and must be on the invite list.','Admission requires identity + voice verification + presence on the invite list — a true zero-trust join.'],
 ['p15','1.5','Inside, the Lords show their letters patent to one another to prove who they say they are.','Participants mutually verify individual identities in-meeting — only verified individuals take part.'],
],
2:[
 ['p21','2.1','All the Lords share their letters patent.','Every participant contributes their individual identity to establish the session.'],
 ['p22','2.2','Combined, the letters patent create a “magic” book holding the code the Lords use to speak inside the chamber.','Their combination derives the shared meeting key used for end-to-end encryption.'],
 ['p23','2.3','Each time a Lord enters or leaves, a new book is created and replaces the old — everyone uses the new one from then on.','The key is re-derived on every join and leave — giving forward and backward secrecy.'],
 ['p24','2.4','A crow eavesdropping at the window has no book, so it cannot understand a word.','An eavesdropper without the key sees only ciphertext — even the SaaS provider cannot decrypt.'],
],
3:[
 ['p31','3.1','The King employs Maesters — learned scholars, doctors and advisors — to serve as scribes in sensitive meetings.','Optional services — Video Mesh Node and on-prem AI — act as trusted scribes and advisors.'],
 ['p32','3.2','The King issues the Maesters their own special letters patent, used just like a Lord’s.','Those services are issued their own verifiable identity and admitted like any other participant.'],
 ['p33','3.3','The chairperson may ask a Maester to enter the room.','The meeting organizer explicitly invites the service into the session.'],
 ['p34','3.4','The Maester shows their letters patent, a new book is generated, and they can then follow, document and advise.','On join the key rotates to include it; it can transcribe, record and advise inside the meeting.'],
 ['p35','3.5','When done, all records go to the King’s secure vault — which the castle operator cannot open.','Records are stored under customer control; the SaaS provider holds no keys and has no access.'],
],
4:[
 ['p41','4.1','Sometimes the Lords must speak to servants — to call for food and wine.','Some conversations must reach the outside world, e.g. PSTN or legacy endpoints.'],
 ['p42','4.2','Via the Maester, the Chairman adds a special Babel Fish to translate between the coded conversation and the outside world.','A controlled gateway bridges the encrypted meeting and external audio, in both directions.'],
],
5:[
 ['p51','5.1','Sometimes Lords bring in people on other systems to discuss alliances — the Kingdom of the Isles.','External parties on different platforms can be brought in for cross-org and C2B collaboration.'],
 ['p52','5.2','These talks are sensitive and must stay protected — yet cannot be confined to the chamber.','The exchange stays protected even as it extends beyond the core meeting.'],
 ['p53','5.3','The King issues a temporary letters patent, sent by Carrier Crow.','A temporary, time-bound identity is issued and delivered to the external participant.'],
 ['p54','5.4','The envoy uses a Magic Mirror — standard across all kingdoms — to join remotely, presents the temporary patent, and a new book is shared.','They join via a standard browser; presenting the temp identity rotates the key to include them.'],
],
};
const CAST = [
 ['king','The King','Customer · Enterprise'],
 ['lords','The Lords','Management team — the participants'],
 ['castle','The Castle','Collaboration SaaS provider (Cisco)'],
 ['chamber','Meeting Chamber','The meeting itself'],
 ['maester','Maesters','Video Mesh Node & on-prem AI'],
 ['medallion','Medallion','Webex identity + voiceprint'],
 ['patent','Letters Patent','Individual, per-user identity'],
];
const RECAP = [
 ['Verified Identity','Independently verified individuals — no deepfakes.'],
 ['E2E Encryption','Rotating keys the provider can never hold.'],
 ['Services','AI & recording join under the same trust — records stay yours.'],
 ['Including Others','Controlled bridges to PSTN and the outside world.'],
 ['External Guests','Secure browser access with temporary identities.'],
];

const SEAL = `<div class="seal"><span class="ln"></span>
  <svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="13" fill="#C8324B" stroke="#8e1e30" stroke-width="2"/>
  <path d="M9 18l1.6-6 2.8 3L16 11l2.6 4 2.8-3L23 18z" fill="#8e1e30"/><circle cx="16" cy="20.5" r="1.6" fill="#8e1e30"/></svg>
  <span class="ln r"></span></div>`;

// build navigation sequence
const SEQ = [{t:'title'}];
CH.forEach(c=>{ SEQ.push({t:'divider', ch:c.n}); PANELS[c.n].forEach((p,i)=> SEQ.push({t:'panel', ch:c.n, pi:i})); });
SEQ.push({t:'recap'});

let idx = 0, decoded = true, revealTimer=null;
const stage = document.getElementById('stage');
const bg = document.getElementById('bg');
const reduce = window.matchMedia('(prefers-reduced-motion:reduce)').matches;

function chOf(i){ return CH.find(c=>c.n===i); }
// escape every character that is unsafe in element text OR inside a quoted attribute —
// scene copy is interpolated into both (e.g. alt="${esc(story)}")
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                                 .replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function sceneHTML(s){
  if(s.t==='title'){
    return `<div class="scene on"><div class="title-wrap">
      <div class="a">A Visual Storyboard</div>
      <!-- real spaces (not &nbsp;) so the line can wrap on narrow screens, and a space
           before the <br> so hiding it on mobile still reads "of Ultra", not "ofUltra" -->
      <h1>The Kingdom of <br>Ultra Secure Collaboration</h1>
      <p class="sub">A medieval kingdom, told twice — the fable on parchment, the Cisco zero-trust meeting it stands for on the other side of every panel.</p>
      <button class="enter" id="begin">Enter the kingdom →</button>
      <div class="hint">Move with <kbd>←</kbd> <kbd>→</kbd> · decode with <kbd>D</kbd> · cast with <kbd>C</kbd></div>
    </div></div>`;
  }
  if(s.t==='divider'){
    const c = chOf(s.ch);
    return `<div class="scene on"><div class="divider">
      <div class="kicker">Chapter ${c.num} · Story slide ${c.src}</div>
      <h2>${esc(c.title)}</h2>
      <div class="tag">${esc(c.tagline)}</div>
      <div class="concept"><span class="c">In Cisco terms</span><span class="d">${esc(c.concept)}</span><span class="ga">${c.ga}</span></div>
    </div></div>`;
  }
  if(s.t==='recap'){
    return `<div class="scene on"><div class="recap">
      <h2>Five chapters, one guarantee</h2>
      <div class="lead">Meeting customers where they are — securely.</div>
      <ol>${RECAP.map((r,i)=>`<li><span class="num">${i+1}</span><span class="rt"><b>${esc(r[0])}</b><span>${esc(r[1])}</span></span></li>`).join('')}</ol>
    </div></div>`;
  }
  // panel
  const c = chOf(s.ch); const [img,label,story,cisco] = PANELS[s.ch][s.pi];
  return `<div class="scene on"><div class="panel">
    <div class="frame">
      <img src="${A}${img}.jpg" alt="${esc(story)}" />
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <span class="code">PANEL ${label}</span>
    </div>
    <div class="telling">
      <div class="eyebrow">Chapter ${c.num}<span class="rn">— ${esc(c.title)}</span></div>
      <div class="story"><div class="lab">The Story</div><p>${esc(story)}</p></div>
      ${SEAL}
      <div class="decoded${decoded?'':' hidden'}" id="dec">
        <div class="tech"><div class="lab" id="techLab">In Cisco Terms</div><p>${esc(cisco)}</p></div>
      </div>
    </div>
  </div>`;
}

function currentImg(s){
  if(s.t==='title'||s.t==='recap') return 'title';
  if(s.t==='divider') return chOf(s.ch).hero;
  return PANELS[s.ch][s.pi][0];
}

/* what a screen reader should hear when the scene changes */
function sceneLabel(s){
  if(s.t==='title') return 'Title. The Kingdom of Ultra Secure Collaboration.';
  if(s.t==='recap') return 'Recap. Five chapters, one guarantee.';
  if(s.t==='divider') return `Chapter ${chOf(s.ch).num}. ${chOf(s.ch).title}.`;
  const [,label,story] = PANELS[s.ch][s.pi];
  return `Panel ${label}, ${panelNumber(s)} of 20. ${story}`;
}

function render(){
  const s = SEQ[idx];
  stage.innerHTML = sceneHTML(s);
  bg.style.backgroundImage = `url('${A}${currentImg(s)}.jpg')`;
  bg.classList.toggle('hero', s.t==='title');
  document.getElementById('prev').disabled = idx===0;
  document.getElementById('next').disabled = idx===SEQ.length-1;
  const b = document.getElementById('begin'); if(b) b.onclick = ()=>go(1);

  // an illustration that fails to load should say so rather than sit blank
  const fimg = stage.querySelector('.frame img');
  if(fimg) fimg.addEventListener('error', ()=>{
    fimg.classList.add('err'); fimg.closest('.frame').classList.add('err');
  }, {once:true});

  buildRail();
  warmAround(idx);
  document.getElementById('liveNote').textContent = sceneLabel(s);
  // counter
  const ct = document.getElementById('counter');
  if(s.t==='panel'){ ct.innerHTML = `<b>${PANELS[s.ch][s.pi][1]}</b> · panel ${panelNumber(s)}/20`; }
  else if(s.t==='divider'){ ct.textContent = `Chapter ${chOf(s.ch).num}`; }
  else ct.textContent = s.t==='title' ? 'Start' : 'Fin';
}
function panelNumber(s){ let k=0; for(const it of SEQ){ if(it.t==='panel'){k++; if(it===s) return k;} } return k; }

/* The rail is built ONCE as real <button>s (keyboard-operable, announced to AT);
   afterwards only the state classes are updated, so navigating never destroys focus. */
function buildRail(){
  const rail = document.getElementById('rail');
  const s = SEQ[idx];

  if(!rail.childElementCount){
    CH.forEach(c=>{
      const seg = document.createElement('button');
      seg.type = 'button';
      seg.className = 'chseg';
      seg.dataset.ch = c.n;
      seg.setAttribute('aria-label', `Chapter ${c.num}: ${c.title}`);
      seg.innerHTML = `<div class="ticks">${PANELS[c.n].map(()=>'<span class="tick"></span>').join('')}</div>`
                    + `<div class="chname">${c.num}. ${esc(c.title)}</div>`;
      seg.addEventListener('click', ()=>{
        const t = SEQ.findIndex(x=>x.t==='divider' && x.ch===c.n);
        if(t>=0) goto(t);
      });
      rail.appendChild(seg);
    });
  }

  [...rail.children].forEach(seg=>{
    const n = Number(seg.dataset.ch);
    const active = (s.ch===n);
    seg.classList.toggle('active', active);
    seg.setAttribute('aria-current', active ? 'true' : 'false');
    [...seg.querySelectorAll('.tick')].forEach((t,i)=>{
      let done=false, cur=false;
      if(s.t==='panel' && s.ch===n){ done = i<s.pi; cur = i===s.pi; }
      else if(n < (s.ch||0) || s.t==='recap'){ done = true; }
      t.classList.toggle('done', done);
      t.classList.toggle('cur', cur);
    });
  });
}

function goto(i, opts){
  opts = opts || {};
  idx = Math.max(0, Math.min(SEQ.length-1, i));
  render();

  // keep the URL in step so the current panel can be linked to and survives a refresh
  const h = '#' + hashFor(SEQ[idx]);
  if(!opts.fromHash && location.hash !== h){
    try{ history[opts.replace ? 'replaceState' : 'pushState'](null, '', h); }
    catch(_){ location.hash = h; }        // file:// in some browsers rejects pushState
  }

  // move focus to the new scene so keyboard users don't get dropped back to the body
  if(!opts.initial) stage.focus({preventScroll:true});
}
// Back/Forward should step through the storyboard
window.addEventListener('popstate', ()=>{
  const i = indexFromHash();
  if(i !== idx) goto(i, {fromHash:true});
});
function go(d){ goto(idx+d); }

// decode toggle
const btnDecode = document.getElementById('btnDecode');
function setDecode(v){
  decoded = v; btnDecode.setAttribute('aria-pressed', v); btnDecode.textContent = v?'Decoded':'Story only';
  const dec = document.getElementById('dec');
  if(dec){ dec.classList.toggle('hidden', !v); if(v) cipherReveal(); }
}
btnDecode.onclick = ()=> setDecode(!decoded);

function cipherReveal(){
  if(reduce) return; const el = document.getElementById('techLab'); if(!el) return;
  const target='In Cisco Terms'; const glyphs='ΔΞ#%×0110¬∎ø7@';
  let f=0; clearInterval(revealTimer);
  revealTimer = setInterval(()=>{
    el.textContent = target.split('').map((ch,i)=> i< f? ch : (ch===' '?' ':glyphs[(Math.random()*glyphs.length)|0])).join('');
    f += 0.7; if(f>=target.length){ clearInterval(revealTimer); el.textContent=target; }
  }, 28);
}

// cast overlay
const castOverlay = document.getElementById('castOverlay');
document.getElementById('castGrid').innerHTML = CAST.map(c=>
  // lazy + async: the dialog is display:none at load, so these 7 portraits are not
  // fetched until it is actually opened
  `<div class="cc"><img src="${A}cast_${c[0]}.jpg" alt="${esc(c[1])}" loading="lazy" decoding="async"><div class="nm">${esc(c[1])}</div><div class="rl">${esc(c[2])}</div></div>`).join('');
let castOpener = null;
function openCast(v){
  const closeBtn = document.getElementById('castClose');
  if(v){
    warmCast();                                   // only fetch the 7 portraits when actually needed
    castOpener = document.activeElement;
    castOverlay.classList.add('on');
    closeBtn.focus();
  } else {
    castOverlay.classList.remove('on');
    if(castOpener && castOpener.focus) castOpener.focus();   // return focus where it came from
    castOpener = null;
  }
}
document.getElementById('btnCast').onclick=()=>openCast(true);
document.getElementById('castClose').onclick=()=>openCast(false);
castOverlay.onclick=(e)=>{ if(e.target===castOverlay) openCast(false); };

// keep Tab inside the dialog while it is open
castOverlay.addEventListener('keydown',(e)=>{
  if(e.key!=='Tab') return;
  const f=[...castOverlay.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')]
          .filter(el=>el.offsetParent!==null);
  if(!f.length) return;
  const first=f[0], last=f[f.length-1];
  if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
});

// fullscreen
document.getElementById('btnFull').onclick=()=>{
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
};

// nav buttons
document.getElementById('prev').onclick=()=>go(-1);
document.getElementById('next').onclick=()=>go(1);

/* swipe on touch devices — horizontal only, so vertical scrolling still works */
(function(){
  let x0=null, y0=null, t0=0;
  stage.addEventListener('touchstart',(e)=>{
    if(e.touches.length!==1) return;
    x0=e.touches[0].clientX; y0=e.touches[0].clientY; t0=e.timeStamp;
  }, {passive:true});
  stage.addEventListener('touchend',(e)=>{
    if(x0===null) return;
    const t=e.changedTouches[0];
    const dx=t.clientX-x0, dy=t.clientY-y0;
    x0=null;
    if(e.timeStamp-t0 > 700) return;                 // too slow to be a swipe
    if(Math.abs(dx) < 45 || Math.abs(dx) < Math.abs(dy)*1.5) return;
    go(dx < 0 ? 1 : -1);
  }, {passive:true});
})();

// keyboard
window.addEventListener('keydown',(e)=>{
  if(castOverlay.classList.contains('on')){ if(e.key==='Escape') openCast(false); return; }
  switch(e.key){
    case 'ArrowRight': case ' ': case 'PageDown': e.preventDefault(); go(1); break;
    case 'ArrowLeft': case 'PageUp': e.preventDefault(); go(-1); break;
    case 'Home': goto(0); break;
    case 'End': goto(SEQ.length-1); break;
    case 'd': case 'D': setDecode(!decoded); break;
    case 'c': case 'C': openCast(true); break;
    case 'f': case 'F': document.getElementById('btnFull').click(); break;
    // Escape cancels the thing you're in — it should not throw away your place in the story.
    // (The cast overlay handles its own Escape above; Home still jumps to the title.)
    case 'Escape':
      if(document.fullscreenElement) document.exitFullscreen?.();
      break;
  }
});

/* ---------- images: fetch what's needed, not all 3.8 MB up front ----------
   Previously every one of the 28 images was requested on load. Now we warm only
   the scenes on either side of the current one, so a visitor who never leaves
   chapter 1 never downloads chapter 5. */
const warmed = new Set();
function warm(name){
  if(!name || warmed.has(name)) return;
  warmed.add(name);
  const im = new Image(); im.src = A + name + '.jpg';
}
function warmAround(i){
  for(let k = i-1; k <= i+2; k++){
    if(k >= 0 && k < SEQ.length) warm(currentImg(SEQ[k]));
  }
}
// the cast overlay's 7 images are only needed if it is actually opened
let castWarmed = false;
function warmCast(){
  if(castWarmed) return; castWarmed = true;
  CAST.forEach(c => warm('cast_' + c[0]));
}

/* ---------- deep linking ----------
   #title, #1.4, #recap — so a panel can be linked to directly and survives a refresh. */
function hashFor(s){
  if(s.t === 'title') return 'title';
  if(s.t === 'recap') return 'recap';
  if(s.t === 'divider') return 'ch' + s.ch;
  return PANELS[s.ch][s.pi][1];              // e.g. "1.4"
}
function indexFromHash(){
  const h = decodeURIComponent((location.hash || '').replace(/^#/, '')).trim().toLowerCase();
  if(!h) return 0;
  const found = SEQ.findIndex(s => hashFor(s).toLowerCase() === h);
  return found >= 0 ? found : 0;
}
window.addEventListener('hashchange', ()=>{
  const i = indexFromHash();
  if(i !== idx) goto(i, {fromHash:true});
});

// initial: honour a #hash if present, without stealing focus or scrolling on load
goto(indexFromHash(), {replace:true, initial:true});
</script>
</body>
</html>
