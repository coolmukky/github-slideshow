name: Deploy ZTA Design Clinic to Pages

on:
  push:
    branches: ["claude/design-clinic-interactive-kvfjdb"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble site (package + downloadable ZIP)
        run: |
          mkdir -p _site
          cp -r offline/package/. _site/
          if [ -f offline/ZTA-Design-Clinic-Package.zip ]; then
            cp offline/ZTA-Design-Clinic-Package.zip _site/
          fi
          touch _site/.nojekyll
          ls -la _site
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 90
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
